name: Deploy GitHub Pages

on:
  push:
    branches: [claude/brave-goodall-sw01qv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base relativa: o site é servido em /Acls-protocolo/, não na raiz
      - run: npx vite build --base=./
      # Publica em gh-pages — o GitHub habilita o Pages automaticamente
      # em repositórios públicos quando essa branch é criada
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
